name: Publication assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Generate
        run: |
          docker build -t assistant-pr-assets .
          mkdir -p /tmp/assets
          docker run --rm --network none --shm-size=1g -v /tmp/assets:/output assistant-pr-assets
      - name: Build and test publisher
        run: docker build --target publisher -t assistant-pr-assets-publisher .
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assets
          path: /tmp/assets/*.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    if: github.repository == 'grafana/assistant-pr-assets' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets
          path: /tmp/assets
      - name: Build and test publisher
        run: docker build --target publisher -t assistant-pr-assets-publisher .
      - name: Publish signed commit to assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker run --rm -e GITHUB_TOKEN -e SOURCE_COMMIT \
            -v /tmp/assets:/output:ro assistant-pr-assets-publisher | tee -a "$GITHUB_STEP_SUMMARY"
