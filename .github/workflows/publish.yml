name: Publication assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate
        run: |
          docker build -t assistant-pr-assets .
          mkdir -p /tmp/assets
          docker run --rm --network none --shm-size=1g -v /tmp/assets:/output assistant-pr-assets
      - name: Build and test publisher
        run: docker build --target publisher -t assistant-pr-assets-publisher .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets
          path: /tmp/assets/*.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    if: github.repository == 'grafana/assistant-pr-assets' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets
          path: /tmp/assets
      - name: Build and test publisher
        run: docker build --target publisher -t assistant-pr-assets-publisher .
      - name: Publish signed commit to assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker run --rm -e GITHUB_TOKEN -e SOURCE_COMMIT \
            -v /tmp/assets:/output:ro assistant-pr-assets-publisher | tee -a "$GITHUB_STEP_SUMMARY"
